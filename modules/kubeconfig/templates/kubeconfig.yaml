# Autogenerated kubeconfig
---
apiVersion: v1
kind: Config
current-context: ${context_name}
preferences: {}
clusters:
  - name: ${cluster_name}
    cluster:
%{ if coalesce(endpoint, "unspecified") != "unspecified" ~}
      server: https://${endpoint}
%{ endif ~}
%{ if coalesce(ca_cert, "unspecified") != "unspecified" ~}
      certificate-authority-data: ${ca_cert}
%{ endif ~}
%{ if coalesce(proxy_url, "unspecified") != "unspecified" ~}
      proxy-url: ${proxy_url}
%{ endif ~}
contexts:
  - name: ${context_name}
    context:
      cluster: ${cluster_name}
      user: ${user_name}
users:
  - name: ${user_name}
    user:
%{ if coalesce(user_token, "unspecified") != "unspecified" ~}
      token: ${user_token}
%{ else ~}
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        command: gke-gcloud-auth-plugin
        installHint: Install gke-gcloud-auth-plugin for use with kubectl by following
          https://cloud.google.com/kubernetes-engine/docs/how-to/cluster-access-for-kubectl#install_plugin
        provideClusterInfo: true
%{ endif ~}
